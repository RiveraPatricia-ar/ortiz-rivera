server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas (evita que Nginx agregue http:// o el puerto interno)
    absolute_redirect off;

    # Dominio sin www -> con www (una sola versión del sitio para Google)
    if ($host = "ortizrivera.com.ar") {
        return 301 https://www.ortizrivera.com.ar$request_uri;
    }

    # /index.html -> /   y   /pagina.html -> /pagina
    if ($request_uri ~ "^/index\.html(\?.*)?$") {
        return 301 /$1;
    }
    if ($request_uri ~ "^/([a-z0-9_-]+)\.html(\?.*)?$") {
        return 301 /$1$2;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache para recursos estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /index.html;
}
